<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Planks - Minecraft Crafting Guide</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main>
      <h1>Planks</h1>
      <img src="https://www.minecraftcrafting.info/imgs/craft_wood.gif" alt="One log of any type anywhere in the crafting grid" class="recipeimg">
      <div class="content">
        <h2>Materials</h2>
        <p>Log</p>
        <a href="index.html""><button class="back">Back</button></a>
      </div>
      <button class="favorite-button" onclick="toggleFavorite()">❤</button>
      <script>
        function toggleFavorite() {
            let recipe = {
                title: document.querySelector("h1").innerText, // Get recipe title
                url: window.location.href
            };
            
            let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
            let index = favorites.findIndex(fav => fav.url === recipe.url);
        
            if (index === -1) {
                favorites.push(recipe);
                document.querySelector(".favorite-button").classList.add("favorited");
            } else {
                favorites.splice(index, 1);
                document.querySelector(".favorite-button").classList.remove("favorited");
            }
        
            localStorage.setItem("favorites", JSON.stringify(favorites));
        }
        
        window.onload = function() {
            let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
            let currentUrl = window.location.href;
            if (favorites.some(fav => fav.url === currentUrl)) {
                document.querySelector(".favorite-button").classList.add("favorited");
            }
        };
        </script>
        
    </main>
  </body>
</html>
