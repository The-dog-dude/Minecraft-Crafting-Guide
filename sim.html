<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafting Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Crafting Simulator</h1>
    <div class="container">
        <div class="grid" id="craftingGrid">
            <div class="slot" id="slot1"></div>
            <div class="slot" id="slot2"></div>
            <div class="slot" id="slot3"></div>
            <div class="slot" id="slot4"></div>
            <div class="slot" id="slot5"></div>
            <div class="slot" id="slot6"></div>
            <div class="slot" id="slot7"></div>
            <div class="slot" id="slot8"></div>
            <div class="slot" id="slot9"></div>
        </div>
        <div class="inventory">
            <h3>Inventory</h3>
            <div class="item" id="wood" draggable="true" ondragstart="drag(event)">
                <img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/7/7a/Stick_JE1_BE1.png/revision/latest/thumbnail/width/360/height/360?cb=20200128023441" alt="Wood">
                <p>Wood</p>
            </div>
            <div class="item" id="planks" draggable="true" ondragstart="drag(event)">
                <img src="https://static.wikia.nocookie.net/minecraft_gamepedia/images/9/93/Crafting_Table_JE3_BE2.png/revision/latest?cb=20190606093431" alt="Planks">
                <p>Planks</p>
            </div>
            <!-- INSERT MORE ITEMS HERE -->
        </div>
        <div class="output">
            <h3>Crafted Item</h3>
            <div id="craftedItem"></div>
        </div>
    </div>
    <button onclick="resetGrid()">Reset Grid</button>

    <script src="script.js"></script>
</body>
</html>
