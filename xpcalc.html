<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css">
  <link rel="favicon" href="./favicon.ico">
  <title>XP Calculator</title>
</head>
<body>
  <div>
    <h1>XP Calculator</h1>
    <label for="currentLevel">Current Level:</label>
    <input type="number" id="currentLevel" min="1" value="1" />
    
    <label for="targetLevel">Target Level:</label>
    <input type="number" id="targetLevel" min="1" value="10" />
    
    <button onclick="calculateXP()">Calculate XP Needed</button>
    
    <p id="levelResult">XP Needed: </p>

    <hr>

    <h1>Total XP Calculator</h1>
    <label for="totalLevel">Level:</label>
    <input type="number" id="totalLevel" min="1" value="1" />
    
    <button onclick="calculateTotalXP()">Calculate Total XP</button>
    
    <p id="totalResult">Total XP: </p>
  </div>

  <script>
    function calculateXP() {
      let currentLevel = parseInt(document.getElementById('currentLevel').value);
      let targetLevel = parseInt(document.getElementById('targetLevel').value);
      let xpNeeded = 0;

      for (let i = currentLevel; i < targetLevel; i++) {
        if (i <= 15) {
          xpNeeded += 2 * i + 7;
        } else if (i <= 30) {
          xpNeeded += 5 * i - 38;
        } else {
          xpNeeded += 9 * i - 158;
        }
      }

      document.getElementById('levelResult').innerText = `XP Needed: ${xpNeeded}`;
    }

    function calculateTotalXP() {
      let level = parseInt(document.getElementById('totalLevel').value);
      let totalXP = 0;

      if (level <= 16) {
        totalXP = Math.pow(level, 2) + 6 * level;
      } else if (level <= 31) {
        totalXP = 2.5 * Math.pow(level, 2) - 40.5 * level + 360;
      } else {
        totalXP = 4.5 * Math.pow(level, 2) - 162.5 * level + 2220;
      }

      document.getElementById('totalResult').innerText = `Total XP: ${totalXP}`;
    }
  </script>
</body>
</html>
