
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Menu</title>
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Minecraftia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <!--//- Menu-->
    <div class="mc-menu">
        <div class="mc-button full">
            <div class="title">Singleplayer</div>
        </div>
        <div class="mc-button full">
            <div class="title">Multiplayer</div>
        </div>
        <div class="mc-button full">
            <div class="title">Minecraft Realms</div>
        </div>
        <div class="double">
            <div class="mc-button full">
                <div class="title">Options</div>
            </div>
            <div class="mc-button full">
                <div class="title">Quit Game</div>
            </div>
        </div>
        <div class="mc-button full lang">
            <div class="title">
                <img src="https://i.ibb.co/99187Lk/lang.png" alt="Lang">
            </div>
        </div>
    </div>

</body>
</html>
