<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Minecraft Crafting Guide</title>
    <link rel="stylesheet" href="./style2.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
  </head>
  <body>
    <main>
        <!-- Menu -->
<div class="mc-menu">
    <!-- Button -->
    <div class="mc-button full">
        <span class="title">Singleplayer</span>
    </div>
    <div class="mc-button full">
        <span class="title">Multiplayer</span>
    </div>
    <div class="mc-button full">
        <span class="title">Minecraft Realms</span>
    </div>

    <!-- Double button -->
    <div class="double">
        <div class="mc-button full">
            <span class="title">Options</span>
        </div>
        <div class="mc-button full">
            <span class="title">Quit Game</span>
        </div>
    </div>

    <!-- Lang button -->
    <div class="mc-button full lang">
        <img src="https://i.ibb.co/99187Lk/lang.png" alt=" Lang">
    </div>
</div>

    </main>
  </body>
</html>
